name: pin2insta cron

# The scheduler, living outside the app. Vercel's Hobby plan only fires a cron
# once a day, which cannot serve three posting slots, so GitHub Actions calls
# the app instead. Both endpoints are POST-only and authenticate with
# CRON_SECRET; nothing else guards them, because /api/cron/* is deliberately
# excluded from the session proxy.
on:
  schedule:
    # Every 30 minutes, which is what keeps a private repo inside GitHub's free
    # 2,000 Actions minutes a month — every run is billed rounded up to a whole
    # minute, and 15-minute ticks come to ~2,880.
    #
    # Nothing is lost by the wider spacing. dueSlots keeps a slot due for 90
    # minutes, so it still gets three chances, and GitHub's scheduler drifts
    # under load — the grace window exists to absorb exactly that. Retries are
    # actually better served: MAX_ATTEMPTS is 3, and spreading them across 90
    # minutes rather than 45 lets a brief outage at Meta pass. The cost is that
    # a post can go out up to 30 minutes after its slot instead of 15.
    #
    # NOTE: this string is matched verbatim by the job's `if:` below. Changing
    # one without the other silently stops the scheduled run.
    - cron: '*/30 * * * *'
    # Insights are free and change slowly; four times a day is plenty. The odd
    # minute keeps it off the crowded top of the hour.
    - cron: '17 */6 * * *'
  # Both jobs are manually runnable. Publishing is safe to trigger by hand: an
  # already-filled slot answers 'already-filled' rather than posting twice.
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: publish
        type: choice
        options: [publish, insights]

jobs:
  publish:
    if: github.event.schedule == '*/30 * * * *' || inputs.job == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/cron/publish" \
            -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail-with-body --max-time 300

  insights:
    if: github.event.schedule == '17 */6 * * *' || inputs.job == 'insights'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh insights
        run: |
          curl -sS -X POST "${{ secrets.APP_URL }}/api/cron/insights" \
            -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail-with-body --max-time 300
